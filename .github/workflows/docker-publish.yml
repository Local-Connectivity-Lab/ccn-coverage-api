name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

concurrency:
  group: docker-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      REGISTRY: icr.seattlecommunitynetwork.org
      IMAGE_NAME: ccn-coverage-api
    steps:
      - name: Resolve release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v1.2.3" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: icr.seattlecommunitynetwork.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish versioned image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAME:$VERSION" .
          docker push "$REGISTRY/$IMAGE_NAME:$VERSION"

      - name: Update latest for the newest release only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            echo "::warning::Versioned image published; latest unchanged because release metadata is unavailable."
            exit 0
          fi
          if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
            docker tag "$REGISTRY/$IMAGE_NAME:$VERSION" "$REGISTRY/$IMAGE_NAME:latest"
            docker push "$REGISTRY/$IMAGE_NAME:latest"
          else
            echo "Published $VERSION; latest remains on $latest_tag."
          fi
