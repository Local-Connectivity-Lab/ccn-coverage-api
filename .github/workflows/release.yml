name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm run test

      - name: Verify API build
        run: npm run build

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_EMAIL: ${{ vars.SCN_GIT_EMAIL }}
          GIT_AUTHOR_NAME: ${{ vars.SCN_GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.SCN_GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.SCN_GIT_NAME }}
          REPO_OWNER: "Local-Connectivity-Lab"
          REPO_NAME: "ccn-coverage-docker"
          TARGET_ARTIFACT_NAME: "ccn-coverage-api"
        run: node scripts/release.mjs

      - name: Login to Docker Registry
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: icr.infra.seattlecommunitynetwork.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish Docker image
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make publish VERSION="$VERSION"

      - name: Update deployment manifest
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: Local-Connectivity-Lab
          REPO_NAME: ccn-coverage-docker
          TARGET_ARTIFACT_NAME: ccn-coverage-api
          GIT_COMMITTER_NAME: ${{ vars.SCN_GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.SCN_GIT_EMAIL }}
        run: node scripts/update-manifest.mjs
